<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Cafe POS</title>
    <script src="https://rwduotornfpbrdroxjne.supabase.co"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5; /* Indigo */
            --primary-hover: #4338CA;
            --success: #10B981; /* Emerald */
            --success-hover: #059669;
            --danger: #EF4444; /* Red */
            --danger-hover: #DC2626;
            --bg: #F3F4F6;
            --card: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; height: 100vh; display: flex; overflow: hidden; }
        
        /* Layout */
        .app-container { display: flex; width: 100%; padding: 20px; gap: 20px; box-sizing: border-box; }
        .panel { background: var(--card); border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); padding: 24px; display: flex; flex-direction: column; border: 1px solid var(--border); }
        .left-panel { flex: 2; }
        .right-panel { flex: 1; min-width: 350px; }

        h2 { margin-top: 0; font-size: 1.25rem; font-weight: 600; color: var(--text-main); }
        
        /* Menu & Scanner */
        .scanner-input { width: 100%; padding: 16px; font-size: 1rem; border: 2px solid var(--border); border-radius: 12px; margin-bottom: 20px; box-sizing: border-box; transition: border-color 0.2s; outline: none; }
        .scanner-input:focus { border-color: var(--primary); }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; overflow-y: auto; }
        .menu-btn { background: var(--card); border: 2px solid var(--border); padding: 16px; border-radius: 12px; cursor: pointer; text-align: left; transition: all 0.2s; display: flex; flex-direction: column; gap: 8px; }
        .menu-btn:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1); }
        .menu-name { font-weight: 600; font-size: 1rem; }
        .menu-price { color: var(--text-muted); font-size: 0.875rem; }

        /* Current Order */
        #order-list { list-style: none; padding: 0; margin: 0 0 20px 0; flex-grow: 1; overflow-y: auto; }
        #order-list li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 1rem; }
        
        /* Checkout Controls */
        .checkout-section { margin-top: auto; border-top: 2px dashed var(--border); padding-top: 20px; }
        .total-display { display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
        
        .btn { padding: 16px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; color: white; transition: background-color 0.2s; width: 100%; display: flex; justify-content: center; align-items: center; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: var(--success-hover); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: var(--danger-hover); }

        /* Auth & Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--card); padding: 32px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .modal-box input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="login-screen" class="modal-overlay">
        <div class="modal-box">
            <h2>Cashier Login</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">Sign in to access the POS system.</p>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button class="btn btn-primary" onclick="handleLogin()">Log In</button>
            <p id="login-error" style="color: var(--danger); font-size: 14px; margin-top: 10px; display: none;"></p>
        </div>
    </div>

    <div class="app-container">
        <div class="panel left-panel">
            <h2>Menu & Scanner</h2>
            <input type="text" id="barcode-input" class="scanner-input" placeholder="Scan barcode or type item ID and press Enter...">
            <div class="menu-grid" id="menu-grid">
                </div>
        </div>

        <div class="panel right-panel">
            <h2>Current Ticket</h2>
            <ul id="order-list">
                <li style="color: var(--text-muted); border: none; justify-content: center; margin-top: 20px;">Ticket is empty</li>
            </ul>
            
            <div class="checkout-section">
                <div class="total-display">
                    <span>Total</span>
                    <span>$<span id="total-price">0.00</span></span>
                </div>
                
                <div class="action-btns">
                    <button class="btn btn-success" onclick="payOrder('Cash')">Pay Cash</button>
                    <button class="btn btn-primary" onclick="payOrder('Card')">Pay Card</button>
                </div>
                <button class="btn btn-danger" onclick="generateZReport()">Run Z-Report</button>
            </div>
        </div>
    </div>

    <div id="report-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Day Close (Z-Report)</h2>
            <div style="margin: 20px 0; line-height: 1.8;">
                <div style="display: flex; justify-content: space-between;"><span>Total Orders:</span> <strong id="z-orders">0</strong></div>
                <div style="display: flex; justify-content: space-between;"><span>Cash Sales:</span> <strong id="z-cash">$0.00</strong></div>
                <div style="display: flex; justify-content: space-between;"><span>Card Sales:</span> <strong id="z-card">$0.00</strong></div>
                <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
                <div style="display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: bold;">
                    <span>Gross Total:</span> <span id="z-total">$0.00</span>
                </div>
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('report-modal').classList.add('hidden')">Close Report</button>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const SUPABASE_URL = 'https://rwduotornfpbrdroxjne.supabase.co';
        const SUPABASE_KEY = 'sb_publishable__DauIC7vEqFuiQP0wgxifw_DjzcASSZ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let menuItems = [];
        let currentOrder = [];
        const taxRate = 0.08;

        // --- Authentication ---
        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('login-error');
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorMsg.innerText = error.message;
                errorMsg.style.display = 'block';
            } else {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('barcode-input').focus();
                loadMenu(); // Load menu only after auth
            }
        }

        // --- App Logic ---
        async function loadMenu() {
            const { data, error } = await supabase.from('menu_items').select('*');
            if (error) return console.error(error);
            menuItems = data;
            renderMenuButtons();
        }

        function renderMenuButtons() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            
            menuItems.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.onclick = () => addToOrder(item);
                btn.innerHTML = `
                    <span class="menu-name">${item.name}</span>
                    <span class="menu-price">$${item.price.toFixed(2)}</span>
                `;
                grid.appendChild(btn);
            });
        }

        document.getElementById('barcode-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const item = menuItems.find(i => i.barcode === this.value);
                item ? addToOrder(item) : alert("Item not found!");
                this.value = ''; 
            }
        });

        function addToOrder(item) {
            currentOrder.push(item);
            updateTicketUI();
        }

        function updateTicketUI() {
            const list = document.getElementById('order-list');
            if (currentOrder.length === 0) {
                list.innerHTML = '<li style="color: var(--text-muted); border: none; justify-content: center; margin-top: 20px;">Ticket is empty</li>';
                document.getElementById('total-price').innerText = '0.00';
                return;
            }

            list.innerHTML = '';
            let subtotal = 0;
            currentOrder.forEach(item => {
                subtotal += item.price;
                const li = document.createElement('li');
                li.innerHTML = `<span>${item.name}</span> <span>$${item.price.toFixed(2)}</span>`;
                list.appendChild(li);
            });

            const total = subtotal + (subtotal * taxRate);
            document.getElementById('total-price').innerText = total.toFixed(2);
        }

        async function payOrder(method) {
            if (currentOrder.length === 0) return;

            const btnText = method === 'Cash' ? 'Processing...' : 'Charging...';
            let subtotal = currentOrder.reduce((sum, item) => sum + item.price, 0);
            let total = subtotal + (subtotal * taxRate);

            // Send to DB
            const { error } = await supabase.from('transactions').insert([{ 
                items: currentOrder.map(i => i.name), 
                total: parseFloat(total.toFixed(2)), 
                method: method 
            }]);

            if (error) {
                alert("Database Error: " + error.message);
                return;
            }

            currentOrder = [];
            updateTicketUI();
        }

        async function generateZReport() {
            const today = new Date();
            today.setHours(0,0,0,0);

            const { data, error } = await supabase
                .from('transactions')
                .select('*')
                .gte('created_at', today.toISOString());

            if (error) return alert(error.message);

            let cashSales = 0, cardSales = 0;
            data.forEach(txn => {
                if (txn.method === 'Cash') cashSales += txn.total;
                if (txn.method === 'Card') cardSales += txn.total;
            });

            document.getElementById('z-orders').innerText = data.length;
            document.getElementById('z-cash').innerText = `$${cashSales.toFixed(2)}`;
            document.getElementById('z-card').innerText = `$${cardSales.toFixed(2)}`;
            document.getElementById('z-total').innerText = `$${(cashSales + cardSales).toFixed(2)}`;
            
            document.getElementById('report-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
